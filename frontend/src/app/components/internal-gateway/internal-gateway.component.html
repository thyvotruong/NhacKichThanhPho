<!-- ============================================================
     CỔNG ĐĂNG NHẬP NỘI BỘ TIÊU CHUẨN & BẢO MẬT (STAFF LOGIN GATEWAY)
     Phong cách: The Greatest Showman (Deep Midnight Blue & Gold Glow)
     ============================================================ -->

<div class="internal-gateway-page position-relative d-flex align-items-center justify-content-center py-5">


  <div class="container position-relative z-2">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-6">
        <!-- Khối Đăng Nhập Nội Bộ -->
        <div class="card-showman-glass p-4 p-md-5 rounded-4 border border-gold-glow shadow-2xl">
          <!-- Header Emblem -->
          <div class="text-center mb-4">
            
            
            <h2 class="text-gold-gradient display-2 fw-bold mt-2 mb-3 lh-base">
              NHẠC KỊCH THÀNH PHỐ
            </h2>
            <p class="text-white text-secondary mb-0">
              Hệ thống xác thực dành cho nhân viên nội bộ
            </p>
          </div>

          <!-- Thông báo lỗi hoặc cảnh báo quyền hạn từ Route Guard -->
          @if (errorMessage()) {
            <div class="alert alert-danger rounded-3 mb-4 d-flex align-items-center gap-2 small">
              <i class="bi bi-exclamation-triangle-fill fs-5 flex-shrink-0"></i>
              <span>{{ errorMessage() }}</span>
            </div>
          }

          <!-- Form Đăng Nhập Bảo Mật -->
          <form (ngSubmit)="onSubmit()" class="d-flex flex-column gap-3">
            <!-- Ô nhập: Tên đăng nhập / Email / Mã nhân viên -->
            <div>
              <label class="form-label text-gold small fw-bold text-uppercase mb-1">
                 TÊN ĐĂNG NHẬP:
              </label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-dark-glass text-gold border-secondary border-opacity-25">
                  <i class="bi bi-person-fill"></i>
                </span>
                <input
                  type="text"
                  class="form-control bg-dark-glass text-white border-secondary border-opacity-25 fs-6"
                  placeholder="Nhập tên đăng nhập hoặc email..."
                  [ngModel]="identifier()"
                  (ngModelChange)="identifier.set($event)"
                  name="identifier"
                  autocomplete="username"
                  required
                />
              </div>
            </div>

            <!-- Ô nhập: Mật khẩu / Mã PIN -->
            <div>
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label text-gold small fw-bold text-uppercase mb-0">
                   MẬT KHẨU:
                </label>
              </div>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-dark-glass text-gold border-secondary border-opacity-25">
                  <i class="bi bi-shield-shaded"></i>
                </span>
                <input
                  [type]="showPassword() ? 'text' : 'password'"
                  class="form-control bg-dark-glass text-white border-secondary border-opacity-25 fs-6"
                  placeholder="Nhập mật khẩu nội bộ..."
                  [ngModel]="password()"
                  (ngModelChange)="password.set($event)"
                  name="password"
                  autocomplete="current-password"
                  required
                />
                <button
                  type="button"
                  class="btn btn-outline-secondary border-secondary border-opacity-25 text-gold"
                  (click)="toggleShowPassword()"
                  title="Hiện/Ẩn mật khẩu"
                >
                  <i class="bi" [class.bi-eye-fill]="!showPassword()" [class.bi-eye-slash-fill]="showPassword()"></i>
                </button>
              </div>
            </div>

            <!-- Nút bấm Đăng Nhập Hệ Thống -->
            <div class="d-grid mt-3">
              <button
                type="submit"
                class="btn btn-showman-gold py-3 fw-bold fs-6 shadow-2xl d-flex align-items-center justify-content-center gap-2"
                [disabled]="isSubmitting()"
              >
                @if (isSubmitting()) {
                  <span class="spinner-border spinner-border-sm"></span>
                  <span>Đang xác thực thông tin...</span>
                } @else {
                  <i class="bi bi-box-arrow-in-right fs-5"></i>
                  <span>ĐĂNG NHẬP HỆ THỐNG</span>
                }
              </button>
            </div>
          </form>

          <!-- Bộ Chọn Nhanh Thử Nghiệm Phân Quyền (Testing Quick Fill) -->
          <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
            <span class="text-secondary small fw-bold d-block mb-2">
              <i class="bi bi-code-square text-gold me-1"></i> TÀI KHOẢN MẪU KIỂM THỬ PHÂN QUYỀN RBAC:
            </span>
            <div class="d-flex flex-wrap gap-2 justify-content-center">
              <button
                type="button"
                class="btn btn-sm btn-outline-warning py-1 px-2 small"
                (click)="fillQuickCredential('admin')"
                title="Quản trị viên tối cao: Toàn quyền"
              >
                <i class="bi bi-shield-fill text-gold me-1"></i> Admin
              </button>
              <button
                type="button"
                class="btn btn-sm btn-outline-info py-1 px-2 small"
                (click)="fillQuickCredential('editor')"
                title="Biên tập viên: Quản lý Vở kịch & Nghệ sĩ"
              >
                <i class="bi bi-pencil-fill text-info me-1"></i> Biên Tập Viên
              </button>
              <button
                type="button"
                class="btn btn-sm btn-outline-success py-1 px-2 small"
                (click)="fillQuickCredential('staff')"
                title="Nhân viên soát vé: Cổng soát vé"
              >
                <i class="bi bi-upc-scan text-success me-1"></i> Soát Vé (Staff)
              </button>
            </div>
            <div class="text-secondary mt-2" style="font-size: 0.75rem;">
              Mật khẩu mặc định: <strong class="text-gold">123456</strong>
            </div>
          </div>

          <!-- Quay về trang Client -->
          <div class="text-center mt-4">
            <a routerLink="/" class="text-secondary text-decoration-none hover-gold transition-all">
              <i class="bi bi-arrow-left me-1"></i> Quay về Trang Khách hàng
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
