<!-- ============================================================
     PHÂN HỆ NGHỆ SĨ & Ê-KÍP SÁNG TẠO (/artists)
     Phong cách: The Greatest Showman (100% Montserrat)
     ============================================================ -->

<div class="artists-page position-relative py-5">
  <div class="container position-relative z-2">
    <!-- Header Phân Hệ -->
    <div class="text-center mb-5">
      <h2 class="text-gold-gradient display-2 fw-bold mt-2 mb-3 lh-base">GƯƠNG MẶT NGHỆ SĨ TIÊU BIỂU</h2>

      <div class="showman-divider mx-auto mt-1 mb-4"></div>

      <p class="artists-intro max-w-800 mx-auto">
        Hội tụ các bậc thầy đạo diễn, nhạc trưởng thính phòng và các nghệ sĩ sân khấu tài hoa – những người kiến tạo nên những khoảnh khắc nghệ thuật bất hủ.
      </p>
    </div>

    <!-- Lưới Nghệ Sĩ -->
    <div class="row g-4">
      @for (artist of artists(); track artist.name) {
        <div class="col-md-6 col-lg-4">
          <div class="card card-showman-glass rounded-4 p-4 h-100 border border-gold-glow artist-card-hover text-center d-flex flex-column align-items-center position-relative overflow-hidden">
            <!-- Avatar Nghệ Sĩ có khung hào quang vàng -->
            <div class="artist-avatar-wrapper mb-3 mx-auto position-relative">
              <img [src]="artist.avatar" [alt]="artist.name" class="rounded-circle artist-img shadow-lg">
              <div class="artist-halo-ring"></div>
            </div>

            <!-- Danh xưng & Tên -->
            <h4 class="artist-name mb-1">{{ artist.name }}</h4>
            <div class="artist-role mb-3">{{ artist.role }}</div>

            <div class="artist-line mb-3"></div>

            <!-- Tiểu sử -->
            <p class="artist-bio mb-0">
              {{ artist.bio }}
            </p>
          </div>
        </div>
      }
    </div>
  </div>
</div>
