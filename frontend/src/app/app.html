@if (!isInternalPortal()) {
  <!-- ==========================================
       GIAO DIỆN KHÁCH HÀNG (CUSTOMER PORTAL)
       Chỉ dành cho công chúng & khán giả đặt vé
       Không chứa bất kỳ liên kết nội bộ nào
       ========================================== -->
  <div class="d-flex flex-column min-vh-100 bg-showman-canvas">
    <app-navbar></app-navbar>

    <main class="flex-grow-1">
      <router-outlet></router-outlet>
    </main>

    <app-footer></app-footer>
  </div>
} @else {
  <!-- ==========================================
       GIAO DIỆN HỆ THỐNG NỘI BỘ (INTERNAL / STAFF PORTAL)
       Tách biệt hoàn toàn thành trang riêng
       Không hiển thị Navbar hay Footer khách hàng
       ========================================== -->
  <div class="internal-portal-shell min-vh-100 bg-showman-canvas">
    <router-outlet></router-outlet>
  </div>
}

@if (scrollbarVisible) {
  <div
    class="app-scrollbar-track"
    role="scrollbar"
    aria-label="Thanh cuộn trang"
    aria-orientation="vertical"
    aria-valuemin="0"
    aria-valuemax="1000"
    [attr.aria-valuenow]="scrollbarValue"
    tabindex="0"
    (pointerdown)="scrollFromTrack($event)"
    (keydown)="handleScrollbarKeydown($event)"
  >
    <div
      class="app-scrollbar-thumb"
      [class.dragging]="isDraggingScrollbar"
      [style.height.px]="scrollbarHeight"
      [style.transform]="'translateY(' + scrollbarTop + 'px)'"
      (pointerdown)="startScrollbarDrag($event)"
    ></div>
  </div>
}
